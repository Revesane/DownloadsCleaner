name: build-macos

# Проверочная сборка версии для macOS (по кнопке Run workflow во вкладке Actions).
# Артефакты: .app и установщик .dmg для Apple Silicon и Intel.
# Выпуски по тегу собирает release (release-windows.yml) - он же прикладывает .dmg к выпуску.
# Тесты здесь не запускаются: тестовый проект собирается только под Windows.

on:
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.rid }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка .app и установщика .dmg
        run: ./build-mac.sh ${{ matrix.rid }}

      - name: Загрузить .dmg
        uses: actions/upload-artifact@v4
        with:
          name: DownloadsCleaner-${{ matrix.rid }}
          path: publish/macos/*.dmg
          if-no-files-found: error
