name: build-macos

# Сборка версии для macOS по кнопке Run workflow во вкладке Actions:
# .app и установщик .dmg для Apple Silicon и Intel.
# Если указать тег выпуска (например v1.2.0), .dmg собираются с этой версией
# и добавляются к выпуску - так можно досборать Mac-часть уже вышедшего выпуска.
# Тесты здесь не запускаются: тестовый проект собирается только под Windows.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег выпуска, к которому добавить .dmg (пусто - только артефакты)'
        required: false
        default: ''
      runner:
        description: 'Машина GitHub (если на одной долгая очередь - попробуйте другую)'
        required: false
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15-intel

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.rid }}
    # macos-14 больше не выдаётся («configuration is not supported»). Оба варианта (.dmg для
    # Apple Silicon и Intel) собираются на любой машине - .NET умеет собирать под другую архитектуру.
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка .app и установщика .dmg
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then export VERSION="${RELEASE_TAG#v}"; fi
          ./build-mac.sh ${{ matrix.rid }}

      - name: Загрузить .dmg (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: DownloadsCleaner-${{ matrix.rid }}
          path: publish/macos/*.dmg
          if-no-files-found: error

      - name: Добавить .dmg к выпуску
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" publish/macos/*.dmg --clobber
